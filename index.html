<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mein Liebesbuch — Rosen & Gänseblümchen</title>
<style>
  :root{
    --bg1:#fff7fb;
    --bg2:#ffeef7;
    --accent:#b33a5b;
    --paper:#ffeef6; /* rosa Blätter */
    --shadow: rgba(115,51,77,0.12);
    --accent-dark:#8d3158;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: "Georgia", serif; background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--accent-dark);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .container{padding:24px; width:min(1100px,96vw)}
  h1{margin:0 0 18px 0; text-align:center; font-size:clamp(20px,3vw,32px)}

  /* Book stage */
  .stage{
    perspective:1600px;
    display:flex; justify-content:center;
  }

  .book{
    width:880px; max-width:92vw; height:540px; position:relative;
    transform-style:preserve-3d;
  }

  /* Page stack */
  .page{
    --thickness: 0.6px;
    position:absolute; inset:0; width:50%; height:100%;
    left:50%;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition: transform 800ms cubic-bezier(.2,.9,.3,1), box-shadow 300ms;
    box-shadow: 0 8px 30px var(--shadow);
    border-radius:12px;
    overflow:hidden;
    background:transparent;
    cursor:pointer;
  }

  .page .front, .page .back{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--paper); padding:28px;
    display:flex; flex-direction:column; gap:14px;
    border-radius:12px;
  }
  .page .back{ transform:rotateY(180deg); }

  .page.left{ left:0; transform-origin:right center; }
  .page.right{ left:50%; transform-origin:left center; }

  .page.flipped{ transform: rotateY(-180deg); z-index:1; }

  .page[data-index]{ z-index: calc(100 - var(--i)); }

  .paper-title{ font-size:20px; text-align:center; color:var(--accent) }
  .paper-content{ flex:1; font-size:18px; line-height:1.8; overflow:auto; padding-right:8px; color:#5b2340 }
  .paper-img{ width:100%; height:260px; object-fit:cover; border-radius:10px; box-shadow:0 6px 22px rgba(0,0,0,0.12) }

  /* Herz-Ring Trennlinie */
  .sep{ display:inline-block; margin:0 6px; color:#c84d79; font-size:18px; vertical-align:middle }

  /* controls */
  .controls{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:12px }
  .btn{
    background:linear-gradient(180deg,#fff,#ffdfe8); border:1px solid #f2aec3; color:var(--accent);
    padding:10px 14px; border-radius:8px; font-weight:600; cursor:pointer;
    box-shadow:0 6px 18px rgba(115,51,77,0.06);
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed }

  .pager{ font-size:14px; color:#8a435a }

  @media (max-width:900px){
    .book{ height:720px }
    .page{ width:100%; left:0; transform-origin:center center }
    .page.right{ left:0 }
    .page.flipped{ transform: rotateX(-8deg) rotateY(-180deg) translateZ(0) }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    .page, .page .front, .page .back{ transition:none !important; animation:none !important }
    .floating{ display:none }
  }

  /* floating decorations (hearts & rings) */
  .floating{
    position:fixed; pointer-events:none; z-index:40; top:-60px; font-size:30px;
    animation:floatDown linear forwards; opacity:0; transform-origin:center;
  }
  @keyframes floatDown{
    from{ transform:translateY(-60px) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    to{ transform:translateY(110vh) translateX(var(--x)) rotate(360deg); opacity:0; }
  }

  /* decorative border on book */
  .book::before{
    content:''; position:absolute; inset:6px; border-radius:14px; pointer-events:none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
  }

  /* list style: emoji instead of bullet */
  .emoji-list{ list-style:none; padding-left:0; margin:10px 0; display:flex; flex-direction:column; gap:8px }
  .emoji-list li::before{
    content: "❤️💍";
    margin-right:8px; color:#c83b67; font-weight:700;
  }

  .visually-hidden{ position:absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px,1px,1px,1px); white-space:nowrap }

</style>
</head>
<body>
  <div class="container">
    <h1>Mein Liebesbuch — Rosen & Gänseblümchen</h1>

    <div class="stage" aria-label="Liebesbuch" role="application">
      <div class="book" id="book">
        <noscript>
          <div style="padding:24px;border-radius:12px;background:#fff;border:1px solid #ffd9e8">
            Dieses interaktive Buch benötigt JavaScript. Bitte aktiviere JavaScript, um es anzusehen.
          </div>
        </noscript>
      </div>
    </div>

    <div class="controls" aria-hidden="false">
      <button class="btn" id="prev" aria-label="Zurückblättern">❤️💍 Zurück</button>
      <div class="pager" id="pager" aria-live="polite">Seite 1 / 6</div>
      <button class="btn" id="next" aria-label="Weiterblättern">Weiter ❤️💍</button>
    </div>
  </div>

<script>
(function(){
  // Reduced motion check
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Pages with images tailored: heart, rose, daisy/oxeye
  const pages = [
    {
      title:"Für dich, meine Liebe",
      img:"https://source.unsplash.com/1200x800/?heart,heart-shape",
      text:"Dieses Buch ist für dich ❤️💍 Jeder Abschnitt trägt ein kleines Stück von dem, was du mir bedeutest ❤️💍"
    },
    {
      title:"Dein Lächeln",
      img:"https://source.unsplash.com/1200x800/?rose,red-rose",
      text:"Dein Lächeln ist wie die Blüte einer Rose ❤️💍 Es wärmt mein Herz und bringt Farbe in jeden Tag ❤️💍"
    },
    {
      title:"Unsere Erinnerungen",
      img:"https://source.unsplash.com/1200x800/?daisy,oxeye-daisy",
      text:"Die kleinen Momente sind kostbar ❤️💍 Spaziergänge, Lachen, vertraute Stille — Erinnerungen, die bleiben ❤️💍"
    },
    {
      title:"Meine Versprechen",
      img:"https://source.unsplash.com/1200x800/?ring,engagement-ring",
      text:"Ich verspreche dir Respekt, Treue und Nähe ❤️💍 An deiner Seite sein, durch alle Tage und Nächte ❤️💍"
    },
    {
      title:"Wünsche & Träume",
      img:"https://source.unsplash.com/1200x800/?bouquet,roses,daisies",
      text:"Ich wünsche uns Abenteuer, Ruhe und viele gemeinsame Morgen ❤️💍 Mögen Rosen und Gänseblümchen unseren Weg begleiten ❤️💍"
    },
    {
      title:"Für immer dein",
      img:"https://source.unsplash.com/1200x800/?roses,daisy,heart",
      text:"Du bist mein Zuhause, meine Prinzessin ❤️💍 Ich liebe dich heute, morgen und an allen Tagen danach ❤️💍"
    }
  ];

  const book = document.getElementById('book');
  const pager = document.getElementById('pager');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  if(!book) return;

  // Create pages DOM
  pages.forEach((p, i)=>{
    const page = document.createElement('div');
    page.className = 'page right';
    page.dataset.index = i+1;
    page.style.setProperty('--i', i);
    page.setAttribute('role','button');
    page.setAttribute('tabindex','0');
    page.setAttribute('aria-label', `Seite ${i+1}: ${p.title}`);
    // Construct content with heart-ring separators visually inside paragraphs
    const contentHtml = `
      <div class="front" aria-hidden="false">
        <div class="paper-title">${p.title}</div>
        <img class="paper-img" src="${p.img}" alt="${p.title} - Bild ${i+1}">
        <div class="paper-content">
          ${p.text.split(' ❤️💍 ').map(seg => `<p>${seg} <span class="sep">❤️💍</span></p>`).join('')}
          ${i === pages.length - 1 ? `
            <ul class="emoji-list" aria-label="Dinge, die ich dir verspreche">
              <li>Immer für dich da sein</li>
              <li>Mit dir lachen und weinen</li>
              <li>Unsere Liebe pflegen wie Rosen</li>
            </ul>` : ''}
        </div>
      </div>
      <div class="back" aria-hidden="true">
        <div style="margin:auto;text-align:center;color:var(--accent-dark)">
          <div style="font-size:48px;line-height:1">❤️💍</div>
          <div style="margin-top:8px">Seite ${i+1}</div>
        </div>
      </div>
    `;
    page.innerHTML = contentHtml;
    book.appendChild(page);
  });

  let current = 0;
  const total = pages.length;

  const pageElements = Array.from(book.querySelectorAll('.page')).reverse();

  function render(){
    pager.textContent = `Seite ${Math.min(current+1,total)} / ${total}`;
    prevBtn.disabled = current <= 0;
    nextBtn.disabled = current >= total-1;

    pageElements.forEach((el, idx)=>{
      const pageIndex = total - idx - 1;
      if(pageIndex <= current - 1){
        el.classList.add('flipped');
        el.querySelector('.front')?.setAttribute('aria-hidden','true');
        el.querySelector('.back')?.setAttribute('aria-hidden','false');
      }else{
        el.classList.remove('flipped');
        el.querySelector('.front')?.setAttribute('aria-hidden','false');
        el.querySelector('.back')?.setAttribute('aria-hidden','true');
      }
      if(pageIndex === current) el.setAttribute('tabindex','0');
      else el.setAttribute('tabindex','-1');
    });
  }

  function go(n){
    current = Math.max(0, Math.min(total-1, n));
    render();
    // Decorative burst when page changes (unless reduced-motion)
    if(!prefersReduced){
      for(let i=0;i<18;i++){
        setTimeout(()=>createFloating(), i * 60);
      }
    }
  }

  // clicking: left half -> back, right half -> forward (on small screens tap advances)
  book.addEventListener('click', (e)=>{
    const rect = book.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if(window.matchMedia('(max-width:900px)').matches){
      go(current + 1);
      return;
    }
    if(x < rect.width/2) go(current - 1);
    else go(current + 1);
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight' || e.key === 'Right'){ go(current + 1); }
    else if(e.key === 'ArrowLeft' || e.key === 'Left'){ go(current - 1); }
    else if(e.key === 'Home'){ go(0); }
    else if(e.key === 'End'){ go(total - 1); }
  });

  prevBtn.addEventListener('click', ()=>go(current - 1));
  nextBtn.addEventListener('click', ()=>go(current + 1));

  // swipe support
  let touchStartX = null;
  book.addEventListener('touchstart', (e)=>{ if(e.touches && e.touches[0]) touchStartX = e.touches[0].clientX; }, {passive:true});
  book.addEventListener('touchend', (e)=>{
    if(touchStartX == null) return;
    const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : null;
    if(endX == null) return;
    const dx = endX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0) go(current + 1);
      else go(current - 1);
    }
    touchStartX = null;
  });

  // Floating hearts and rings generator
  function createFloating(){
    if(prefersReduced) return;
    const emojis = ['❤️','💕','💗','💖','💞','💓','💘','💝','💍','❤️💍','💍❤️'];
    const el = document.createElement('div');
    el.className = 'floating';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (5 + Math.random() * 90) + 'vw';
    const size = 18 + Math.random() * 36;
    el.style.fontSize = size + 'px';
    el.style.animationDuration = (3 + Math.random() * 5) + 's';
    el.style.setProperty('--x', ((Math.random() - 0.5) * 160) + 'px');
    el.style.opacity = 0;
    el.setAttribute('aria-hidden','true');
    document.body.appendChild(el);
    el.addEventListener('animationend', ()=>{ if(el && el.parentNode) el.parentNode.removeChild(el); });
  }

  // Create a few gentle background floating emojis at start (decorative)
  if(!prefersReduced){
    for(let i=0;i<8;i++){
      setTimeout(createFloating, i * 450);
    }
    // steady slow drift
    const steady = setInterval(createFloating, 2200);
    // stop steady after some time to avoid overload
    setTimeout(()=>clearInterval(steady), 22000);
    // clear on unload
    window.addEventListener('beforeunload', ()=>clearInterval(steady));
  }

  // Initialize
  go(0);

  // Screen reader live region
  const live = document.createElement('div');
  live.className = 'visually-hidden';
  live.setAttribute('aria-live','polite');
  document.body.appendChild(live);
  const obs = new MutationObserver(()=>{ live.textContent = `Seite ${Math.min(current+1,total)} von ${total}`; });
  obs.observe(pager, {childList:true, characterData:true, subtree:true});

})();
</script>
</body>
</html>
