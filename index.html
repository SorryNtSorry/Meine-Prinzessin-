<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mein Liebesbuch</title>
<style>
  :root{
    --bg1:#fff6fb;
    --bg2:#ffeef7;
    --accent:#b33a5b;
    --paper:#fff;
    --shadow: rgba(115,51,77,0.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: "Georgia", serif; background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:#6b2a42;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .container{padding:24px; width:min(1100px,96vw)}
  h1{margin:0 0 18px 0; text-align:center; font-size:clamp(20px,3vw,32px)}

  /* Book stage */
  .stage{
    perspective:1500px;
    display:flex; justify-content:center;
  }

  .book{
    width:880px; max-width:92vw; height:520px; position:relative;
    transform-style:preserve-3d;
  }

  /* Page stack */
  .page{
    --thickness: 0.6px;
    position:absolute; inset:0; width:50%; height:100%;
    left:50%;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition: transform 800ms cubic-bezier(.2,.9,.3,1), box-shadow 300ms;
    box-shadow: 0 8px 30px var(--shadow);
    border-radius:10px;
    overflow:hidden;
    background:transparent;
    cursor:pointer;
  }

  /* Back face when flipped */
  .page .front, .page .back{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--paper); padding:28px;
    display:flex; flex-direction:column; gap:12px;
  }

  .page .back{ transform:rotateY(180deg); }

  /* positioning so left and right pages show like a book */
  .page.left{ left:0; transform-origin:right center; }
  .page.right{ left:50%; transform-origin:left center; }

  /* When a page is flipped */
  .page.flipped{ transform: rotateY(-180deg); z-index:1; }

  /* Make sure later pages sit on top */
  .page[data-index]{ z-index: calc(100 - var(--i)); }

  /* Paper style */
  .paper-title{ font-size:20px; text-align:center; color:var(--accent) }
  .paper-content{ flex:1; font-size:18px; line-height:1.7; overflow:auto; padding-right:8px }
  .paper-img{ width:100%; height:260px; object-fit:cover; border-radius:8px; box-shadow:0 6px 22px rgba(0,0,0,0.12) }

  /* controls */
  .controls{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:12px }
  .btn{
    background:linear-gradient(180deg,#fff,#ffdfe8); border:1px solid #f2aec3; color:var(--accent);
    padding:10px 14px; border-radius:8px; font-weight:600; cursor:pointer;
    box-shadow:0 6px 18px rgba(115,51,77,0.06);
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed }

  /* page indicator */
  .pager{ font-size:14px; color:#8a435a }

  /* small screens: stack */
  @media (max-width:900px){
    .book{ height:600px }
    .page{ width:100%; left:0; transform-origin:center center }
    .page.right{ left:0 }
    .page.flipped{ transform: rotateX(-8deg) rotateY(-180deg) translateZ(0) }
  }

  /* reduced motion: no flipping */
  @media (prefers-reduced-motion: reduce){
    .page, .page .front, .page .back{ transition:none !important; animation:none !important }
  }

  /* accessibility helpers */
  .visually-hidden{ position:absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px,1px,1px,1px); white-space:nowrap }
</style>
</head>
<body>
  <div class="container">
    <h1>Mein Liebesbuch</h1>

    <div class="stage" aria-label="Liebesbuch" role="application">
      <div class="book" id="book">
        <!-- Pages will be generated by JS for clarity; fallback content for no-JS users below -->
        <noscript>
          <div style="padding:24px;border-radius:12px;background:#fff;border:1px solid #ffd9e8">
            Dieses interaktive Buch benötigt JavaScript. Bitte aktiviere JavaScript, um es anzusehen.
          </div>
        </noscript>
      </div>
    </div>

    <div class="controls" aria-hidden="false">
      <button class="btn" id="prev" aria-label="Zurückblättern">◀ Zurück</button>
      <div class="pager" id="pager" aria-live="polite">Seite 1 / 6</div>
      <button class="btn" id="next" aria-label="Weiterblättern">Weiter ▶</button>
    </div>
  </div>

<script>
(function(){
  // Pages data (replace image URLs / text as you like)
  const pages = [
    {title:"Für dich, meine Liebe", img:"https://picsum.photos/seed/love1/1200/800", text:"Mein Herz, dieses Buch ist nur für dich. Jeder Seite steht für ein kleines Stück von dem, was du mir bedeutest."},
    {title:"Dein Lächeln", img:"https://picsum.photos/seed/love2/1200/800", text:"Dein Lächeln erhellt Tage und macht alles leichter. Du bringst Sonne in mein Leben."},
    {title:"Gemeinsame Erinnerungen", img:"https://picsum.photos/seed/love3/1200/800", text:"Die Momente mit dir sind kostbar – die kleinen Gesten, die vertrauten Blicke, jeder Augenblick zählt."},
    {title:"Versprechen", img:"https://picsum.photos/seed/love4/1200/800", text:"Ich verspreche, dich zu respektieren, dir zuzuhören und bei dir zu sein – in guten wie in schweren Zeiten."},
    {title:"Wünsche", img:"https://picsum.photos/seed/love5/1200/800", text:"Ich wünsche mir, mit dir die Welt zu entdecken, gemeinsam zu wachsen und immer füreinander da zu sein."},
    {title:"Für immer dein", img:"https://picsum.photos/seed/love6/1200/800", text:"An jedem weiteren Tag werde ich dich schätzen. Du bist mein Zuhause, meine Prinzessin, mein Herz."}
  ];

  const book = document.getElementById('book');
  const pager = document.getElementById('pager');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  if(!book) return;

  // Build pages DOM: We create one "leaf" per page and place them stacked.
  // Each page is a right-side leaf by default; visually it acts like single pages in a flipbook.
  pages.forEach((p, i)=>{
    const page = document.createElement('div');
    page.className = 'page right';
    page.dataset.index = i+1;
    // custom property for z-ordering in CSS calc
    page.style.setProperty('--i', i);
    page.setAttribute('role','button');
    page.setAttribute('tabindex','0');
    page.setAttribute('aria-label', `Seite ${i+1}: ${p.title}`);
    page.innerHTML = `
      <div class="front" aria-hidden="false">
        <div class="paper-title">${p.title}</div>
        <img class="paper-img" src="${p.img}" alt="${p.title} - Bild ${i+1}">
        <div class="paper-content">${p.text}</div>
      </div>
      <div class="back" aria-hidden="true">
        <div style="margin:auto;text-align:center;font-size:20px;color:var(--accent)">
          <div style="font-size:48px;line-height:1">❤</div>
          <div style="margin-top:8px">Seite ${i+1}</div>
        </div>
      </div>
    `;
    book.appendChild(page);
  });

  let current = 0; // number of pages turned
  const total = pages.length;

  const pageElements = Array.from(book.querySelectorAll('.page')).reverse();
  // reverse so that front-most element is sub[0] for easy stacking control

  function render(){
    pager.textContent = `Seite ${Math.min(current+1,total)} / ${total}`;
    prevBtn.disabled = current <= 0;
    nextBtn.disabled = current >= total-1;

    // for each page: if its index <= current -> flipped
    pageElements.forEach((el, idx)=>{
      const pageIndex = total - idx - 1; // original index
      if(pageIndex <= current - 1){
        el.classList.add('flipped');
        el.querySelector('.front')?.setAttribute('aria-hidden','true');
        el.querySelector('.back')?.setAttribute('aria-hidden','false');
      }else{
        el.classList.remove('flipped');
        el.querySelector('.front')?.setAttribute('aria-hidden','false');
        el.querySelector('.back')?.setAttribute('aria-hidden','true');
      }
      // update tabindex so only next flippable page is reachable
      if(pageIndex === current){
        el.setAttribute('tabindex','0');
      }else{
        el.setAttribute('tabindex','-1');
      }
    });
  }

  function go(n){
    current = Math.max(0, Math.min(total-1, n));
    render();
  }

  // Click handlers: clicking the visible page flips forward; clicking left area flips back
  book.addEventListener('click', (e)=>{
    const rect = book.getBoundingClientRect();
    const x = e.clientX - rect.left; // relative x within book
    if(window.matchMedia('(max-width:900px)').matches){
      // on small screens: tap advances
      go(current + 1);
      return;
    }
    // If clicked left half, go back; right half, go forward
    if(x < rect.width/2) go(current - 1);
    else go(current + 1);
  });

  // Keyboard controls
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight' || e.key === 'Right'){
      go(current + 1);
    }else if(e.key === 'ArrowLeft' || e.key === 'Left'){
      go(current - 1);
    }else if(e.key === 'Home'){
      go(0);
    }else if(e.key === 'End'){
      go(total - 1);
    }
  });

  prevBtn.addEventListener('click', ()=>go(current - 1));
  nextBtn.addEventListener('click', ()=>go(current + 1));

  // Touch: swipe support
  let touchStartX = null;
  book.addEventListener('touchstart', (e)=>{
    if(e.touches && e.touches[0]) touchStartX = e.touches[0].clientX;
  }, {passive:true});
  book.addEventListener('touchend', (e)=>{
    if(touchStartX == null) return;
    const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : null;
    if(endX == null) return;
    const dx = endX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0) go(current + 1);
      else go(current - 1);
    }
    touchStartX = null;
  });

  // Initialize
  go(0);

  // Announce changes for screen readers
  const live = document.createElement('div');
  live.className = 'visually-hidden';
  live.setAttribute('aria-live','polite');
  document.body.appendChild(live);
  const obs = new MutationObserver(()=>{ live.textContent = `Seite ${Math.min(current+1,total)} von ${total}`; });
  obs.observe(pager, {childList:true, characterData:true, subtree:true});

})();
</script>
</body>
</html>
