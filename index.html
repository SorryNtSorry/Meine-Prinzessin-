<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Mein Liebesbuch — Hochformat (Mobil)</title>
<style>
  :root{
    --bg:#fff6fb;
    --panel:#fff1f7;
    --accent:#b33a5b;
    --text:#5b2340;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    font-family: Georgia,serif;
    background:linear-gradient(180deg,var(--bg),#ffeef7);
    color:var(--text);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }

  .wrap{
    width:100%; max-width:760px; display:flex; flex-direction:column; gap:10px; align-items:center;
  }

  h1{ margin:6px 0 0 0; font-size:18px; color:var(--accent); text-align:center }

  /* Viewport fills most of the mobile portrait screen */
  .viewport{
    width:100%; height: calc(100vh - 160px); /* makes room for header + controls on mobile */
    max-height:calc(100vh - 120px);
    background:var(--panel); border-radius:14px; padding:12px;
    box-shadow: 0 20px 40px rgba(120,40,70,0.08);
    overflow:hidden; position:relative;
  }

  /* Pages container: horizontal slider, each slide is full viewport */
  .pages{
    display:flex; height:100%; transition:transform 420ms cubic-bezier(.2,.9,.3,1);
    will-change:transform; width:100%;
  }

  .page{
    flex:0 0 100%;
    padding:8px;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
  }

  .page-inner{
    width:100%; height:100%; box-sizing:border-box;
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:18px; background:linear-gradient(180deg,#fff,#fff7fb); border-radius:10px;
    margin:0 auto; overflow:auto;
  }

  .page-inner h2{ margin:0 0 10px 0; font-size:20px; color:var(--accent); text-align:center }
  .page-inner p{ margin:10px 0; font-size:20px; line-height:1.7; color:var(--text) }

  .controls{
    width:100%; max-width:760px; display:flex; gap:8px; justify-content:space-between; align-items:center;
    margin-top:6px;
  }
  .btn{ background:linear-gradient(180deg,#fff,#ffeef6); border:1px solid #f2afc8; color:var(--accent); padding:10px 14px; border-radius:10px; font-weight:700; cursor:pointer; font-size:15px }
  .btn:disabled{ opacity:.45; cursor:not-allowed }
  .pager{ font-size:14px; color:#8a435a }

  /* Portrait-specific tweaks */
  @media (orientation: portrait){
    h1{ font-size:16px }
    .viewport{ height: calc(100vh - 150px); max-height: calc(100vh - 120px); padding:10px }
    .page-inner{ padding:16px }
    .page-inner p{ font-size:20px; line-height:1.65 }
    .controls{ margin-bottom:8px }
  }

  /* Larger screens: leave some breathing room */
  @media (min-width:900px){
    body{ padding:24px }
    h1{ font-size:20px }
    .viewport{ height:68vh }
    .page-inner p{ font-size:18px }
  }

  @media (prefers-reduced-motion: reduce){
    .pages{ transition:none }
  }

  .visually-hidden{ position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Mein Liebesbuch — Hochformat</h1>

    <div class="viewport" id="viewport" aria-live="polite" role="document">
      <div class="pages" id="pages" aria-label="Seiten des Buchs">
        <!-- JS füllt die Seiten -->
      </div>
    </div>

    <div class="controls">
      <button id="prev" class="btn" aria-label="Zurückblättern">◀ Zurück</button>
      <div class="pager" id="pager" aria-live="polite">Seite 0 / 0</div>
      <button id="next" class="btn" aria-label="Weiterblättern">Weiter ▶</button>
    </div>
  </div>

<script>
(function(){
  // Voller Originaltext (Paragraphs)
  const paragraphs = [
`❤️ Wenn du diesen Brief öffnest, möchte ich dir etwas sagen, was vielleicht gar nicht oft genug gesagt werden kann ❤️`,
`Ich liebe dich über alles ❤️`,
`💍 Seit du in meinem Leben bist, hat sich für mich so vieles verändert ❤️ Du bist für mich nicht einfach nur meine Freundin, sondern du bist der Mensch geworden, der mir unglaublich viel bedeutet.`,
`❤️ Ich liebe dich für so vieles, dass ich wahrscheinlich niemals alles in Worte fassen könnte 💍 Ich liebe dein Lächeln, dein Lachen, deine Stimme, deine Art und einfach alles, was dich zu dem wunderbaren Menschen macht, der du bist.`,
`❤️ Ich bin so unglaublich froh, dass ich dich habe 💍 Manchmal denke ich einfach darüber nach, wie glücklich ich mich schätzen kann, dich gefunden zu haben ❤️ Es gibt so viele Menschen, doch du bist diejenige, die mein Herz berührt.`,
`💍 Du gibst mir ein Gefühl, das ich nicht einfach beschreiben kann ❤️ Wenn ich bei dir bin, möchte ich manchmal einfach nur die Zeit anhalten, damit dieser Moment niemals aufhört 💍 Deine Nähe bedeutet mir alles.`,
`❤️ Ich möchte auch, dass du eines ganz sicher weißt 💍 Ich würde dich niemals betrügen ❤️ Nicht weil ich Angst davor hätte, dich zu verlieren, sondern weil ich gar nicht anders kann – du bist mein größter Schatz.`,
`❤️ Für mich bist du nicht einfach jemand, mit dem ich gerade zusammen bin 💍 Du bist jemand, mit dem ich mir noch ganz viele wunderschöne Momente wünsche ❤️ Ich möchte mit dir lachen, weinen und wachsen.`,
`💍 Wenn es dir schlecht geht, möchte ich derjenige sein, bei dem du dich sicher fühlst ❤️ Wenn du einen schlechten Tag hast, möchte ich dich zum Lächeln bringen 💍 Wenn du zweifelst, möchte ich dir zeigen, wie wertvoll du bist.`,
`❤️ Ich möchte, dass du dich bei mir geliebt fühlst 💍 Ich möchte, dass du weißt, dass du mir vertrauen kannst und dass ich dich niemals absichtlich verletzen möchte ❤️ Natürlich bin auch ich nicht perfekt, aber mein Wille ist es, für dich zu lernen und besser zu werden.`,
`❤️ Du bist für mich meine Prinzessin 👑💍 Du bist mein Lieblingsmensch ❤️ Du bist diejenige, bei der mein Herz schneller schlägt 💍 Du bist diejenige, deren Nachrichten mich zum Lächeln bringen.`,
`💍 Ich liebe unsere gemeinsamen Momente ❤️ Auch die ganz kleinen 💍 Denn manchmal braucht es gar nichts Besonderes ❤️ Es reicht mir schon, neben dir zu liegen, deine Hand zu halten, dich anzusehen und zu wissen, dass du da bist.`,
`❤️ Und falls du irgendwann einmal vergessen solltest, wie viel du mir bedeutest, dann möchte ich, dass du an diesen Brief zurückdenkst 💍 Lies ihn dir wieder durch und erinnere dich daran, wie sehr du geliebt wirst.`,
`💍 Ich möchte dich nicht nur heute lieben ❤️ Ich möchte dir auch morgen zeigen, wie wichtig du mir bist 💍 Und übermorgen ❤️ Und an jedem weiteren Tag, an dem ich das Glück habe, bei dir zu sein.`,
`❤️ Ich kann dir nicht versprechen, dass jeder Tag perfekt sein wird 💍 Aber ich kann dir versprechen, dass ich dich nicht einfach aufgeben möchte, wenn es einmal schwierig wird ❤️ Ich möchte gemeinsam mit dir Lösungen finden.`,
`❤️ Ich möchte noch so viele schöne Momente mit dir erleben 💍 Noch so viele Umarmungen ❤️ Noch so viele Küsse 💋 Noch so viele gemeinsame Abende 💍 Noch so viele Gespräche bis spät in die Nacht.`,
`❤️ Ich wünsche mir, dass wir irgendwann auf all diese Momente zurückblicken und sagen können, dass wir uns füreinander entschieden haben 💍 Dass wir uns gegenseitig gehalten haben ❤️ Dass wir zusammengewachsen sind.`,
`💍 Du bist ein ganz besonderer Mensch für mich ❤️ Und ich hoffe, dass du niemals daran zweifelst 💍 Ich hoffe, du weißt, dass du geliebt wirst ❤️ Dass du wunderschön bist und dass du mir unendlich viel bedeutest.`,
`❤️ Du bist <strong>meine Prinzessin</strong> 👑  <br>💍 Du bist <strong>mein Lieblingsmensch</strong> ❤️  <br>❤️ Du bist <strong>mein Zuhause</strong> 💍  <br>💍 Du bist <strong>mein Herz</strong> ❤️  <br>❤️ Und du bist diejenige, die ich niemals gegen irgendjemanden eintauschen würde.`,
`❤️ Danke, dass du in mein Leben gekommen bist 💍 Danke für deine Liebe ❤️ Danke für deine Nähe 💍 Danke für jedes Lächeln ❤️ Danke für jede Umarmung 💍 Danke für jeden einzelnen Moment.`,
`💍 Und wenn ich dir mit einem einzigen Satz sagen müsste, was du mir bedeutest, dann wäre es dieser ❤️`,
`<strong>Ich liebe dich über alles, meine Prinzessin 👑❤️💍</strong>`,
`❤️ Ich bin unendlich froh, dich zu haben 💍 Ich werde dich immer wertschätzen ❤️ Ich möchte dich glücklich sehen 💍 Ich möchte für dich da sein ❤️ Und ich möchte dir immer zeigen, wie wichtig du mir bist.`,
`❤️ <strong>Du bist meine Liebe, mein Lieblingsmensch und ein ganz besonderer Teil meines Lebens</strong> ❤️`,
`💍 <strong>Ich liebe dich heute ❤️ Ich liebe dich morgen ❤️ Und ich werde jeden einzelnen Moment mit dir schätzen 💍</strong>`
  ];

  const viewport = document.getElementById('viewport');
  const pagesEl = document.getElementById('pages');
  const pager = document.getElementById('pager');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');

  let slides = [];
  let current = 0;

  function makePage(){
    const page = document.createElement('div');
    page.className = 'page';
    const inner = document.createElement('div');
    inner.className = 'page-inner';
    const title = document.createElement('h2');
    title.textContent = 'Für meine Prinzessin';
    inner.appendChild(title);
    page.appendChild(inner);
    pagesEl.appendChild(page);
    slides.push(page);
    return inner;
  }

  function buildPages(){
    pagesEl.innerHTML = '';
    slides = [];
    current = 0;
    let contentBox = makePage();

    for(let i=0;i<paragraphs.length;i++){
      const p = document.createElement('p');
      p.innerHTML = paragraphs[i] + ' <span style="color:#d25a86;margin-left:8px">❤️💍</span>';
      contentBox.appendChild(p);

      // if overflow for the content box, move paragraph to new page
      if(contentBox.scrollHeight - contentBox.clientHeight > 1){
        contentBox.removeChild(p);
        contentBox = makePage();
        contentBox.appendChild(p);
      }
    }

    // update pager and display first page
    updatePager();
    showPage(0, false);
  }

  function updatePager(){
    pager.textContent = `Seite ${current+1} / ${slides.length || 1}`;
    prev.disabled = current <= 0;
    next.disabled = current >= slides.length - 1;
  }

  function showPage(index, animated = true){
    if(!slides.length) return;
    current = Math.max(0, Math.min(slides.length - 1, index));
    const x = -100 * current;
    if(!animated || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      pagesEl.style.transition = 'none';
    } else {
      pagesEl.style.transition = '';
    }
    pagesEl.style.transform = `translateX(${x}%)`;
    if(!animated){
      setTimeout(()=>{ pagesEl.style.transition = ''; }, 20);
    }
    updatePager();
    // focus inner content for accessibility
    const inner = slides[current]?.querySelector('.page-inner');
    if(inner){ inner.tabIndex = -1; inner.focus(); }
  }

  // Controls
  prev.addEventListener('click', ()=> showPage(current - 1));
  next.addEventListener('click', ()=> showPage(current + 1));

  // Portrait: tap anywhere to go forward (makes mobile reading easy)
  viewport.addEventListener('click', (e)=>{
    // if portrait or small screen -> advance on any tap
    if(window.matchMedia('(orientation: portrait)').matches || window.matchMedia('(max-width:640px)').matches){
      showPage(current + 1);
      return;
    }
    // otherwise use half logic
    const rect = viewport.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if(x < rect.width/2) showPage(current - 1);
    else showPage(current + 1);
  });

  // swipe support
  let startX = null;
  viewport.addEventListener('touchstart', (e)=>{ if(e.touches && e.touches[0]) startX = e.touches[0].clientX; }, {passive:true});
  viewport.addEventListener('touchend', (e)=>{
    if(startX == null) return;
    const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : null;
    if(endX == null) return;
    const dx = endX - startX;
    if(Math.abs(dx) > 40){
      if(dx < 0) showPage(current + 1);
      else showPage(current - 1);
    }
    startX = null;
  });

  // keyboard navigation
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight') showPage(current + 1);
    else if(e.key === 'ArrowLeft') showPage(current - 1);
    else if(e.key === 'Home') showPage(0);
    else if(e.key === 'End') showPage(slides.length - 1);
  });

  // rebuild on resize/orientationchange
  let resizeTimer = null;
  function scheduleBuild(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{ buildPages(); }, 200);
  }
  window.addEventListener('resize', scheduleBuild);
  window.addEventListener('orientationchange', scheduleBuild);

  // initial build
  buildPages();

  // expose for debugging
  window._book = { rebuild: buildPages, showPage };

})();
</script>
</body>
</html>
